
<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Friday XML Test</title>
</head>
<body>
  <h2>Проверка на friday.xml</h2>
  <p id="result">Зареждане...</p>

  <script>
    fetch('./friday.xml')
      .then(response => {
        if (!response.ok) throw new Error(response.status);
        return response.text();
      })
      .then(xml => {
        const doc = new DOMParser()
          .parseFromString(xml, 'application/xml');
        if (doc.querySelector('parsererror')) {
          throw new Error('Невалиден XML');
        }
        const marker = doc.querySelector(
          'data[name="friday_test"]'
        );
        document.getElementById('result').textContent =
          marker ? marker.textContent.trim() :
          'XML е зареден, но маркерът липсва';
      })
      .catch(error => {
        document.getElementById('result').textContent =
          'Грешка: ' + error.message;
      });
  </script>
</body>
</html>
